name: Daily Park 35 scrape

on:
  schedule:
    - cron: "17 12 * * *"   # 6:17 AM Central (standard time)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scrape Park 35
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: python scraper/park35.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "apartment-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if [ -d raw ]; then git add raw; fi
          git diff --cached --quiet || git commit -m "Park 35 snapshot $(date -u +%F)"
          git push
