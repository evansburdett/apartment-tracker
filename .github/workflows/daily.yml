name: Daily Park 35 scrape

on:
  schedule:
    # GitHub often starts schedules late or skips them, so ask several times;
    # every run after the first successful one that day exits immediately.
    - cron: "43 9 * * *"    # 3:43 AM Central
    - cron: "7 10 * * *"    # 4:07 AM
    - cron: "23 11 * * *"   # 5:23 AM
    - cron: "41 12 * * *"   # 6:41 AM
    - cron: "19 14 * * *"   # 8:19 AM
    - cron: "37 17 * * *"   # 11:37 AM
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/**", "requirements.txt", "trigger/**"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Skip if today's snapshot already exists (backup schedule only)
        id: guard
        run: |
          today=$(TZ=America/Chicago date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && python -c "import json,sys;d=json.load(open('data/latest.json'));sys.exit(0 if d.get('date')=='$today' and d.get('status')=='ok' else 1)" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already scraped today; skipping."
          fi
      - name: Scrape Park 35
        if: steps.guard.outputs.skip != 'true'
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: python scraper/park35.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "apartment-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if [ -d raw ]; then git add raw; fi
          git diff --cached --quiet || git commit -m "Park 35 snapshot $(date -u +%F)"
          git push
